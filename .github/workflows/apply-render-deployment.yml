name: Apply Render deployment

on:
  push:
    paths:
      - render-deployment.tar.gz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original LaPasion files
        run: |
          mkdir -p /tmp/lapasion-restore
          tar -xzf render-deployment.tar.gz -C /tmp/lapasion-restore
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name render-deployment.tar.gz -exec rm -rf {} +
          cp -a /tmp/lapasion-restore/. .
          rm render-deployment.tar.gz
      - name: Publish restored application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore LaPasion to pre-TFA8 state"
          git push
